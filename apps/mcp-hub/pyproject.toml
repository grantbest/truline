[project]
name = "mcp-hub"
version = "0.1.0"
description = "MCP Hub for Truline Personal OS"
authors = [{ name = "Gemini", email = "gemini@example.org" }]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.4.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "google-api-python-client>=2.129.0",
    "google-auth>=2.20.0",
    "google-auth-oauthlib>=1.2.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.29.0",
    "kubernetes>=29.0.0",
    "temporalio>=1.28.0,<2",
    "plaid-python>=18.0.0",
    "python-jose[cryptography]>=3.3.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=7.1,<8",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "schemathesis>=3.25.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
